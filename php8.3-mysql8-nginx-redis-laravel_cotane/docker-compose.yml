version: '3.8'

services:
    # Laravel Octane Application Service
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                - WWWGROUP=${WWWGROUP}
        image: laravel-octane-app
        container_name: laravel-octane-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        environment:
            - APP_ENV=local
            - APP_DEBUG=true
            - APP_URL=http://localhost:8000
            - DB_CONNECTION=mysql
            - DB_HOST=db
            - DB_PORT=3306
            - DB_DATABASE=${DB_DATABASE}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - REDIS_HOST=redis
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - REDIS_PORT=6379
        depends_on:
            - db
            - redis
        networks:
            - laravel-network

        # Nginx Reverse Proxy Service
    nginx:
        image: nginx:stable-alpine
        container_name: nginx-proxy
        restart: unless-stopped
        ports:
            - "8081:80" # <--- This maps the container's port 80 to your host machine's port 80
        volumes:
            - ./:/var/www/html
            - ./nginx.conf:/etc/nginx/conf.d/default.conf # <--- This mounts the configuration file
        depends_on:
            - app
        networks:
            - laravel-network


    # MySQL Database Service
    db:
        image: mysql:8.0
        container_name: mysql-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
            SERVICE_TAGS: dev
            SERVICE_NAME: mysql
        volumes:
            - dbdata:/var/lib/mysql
        ports:
            - "3307:3306"
        networks:
            - laravel-network

    # Redis Service
    redis:
        image: redis:7.2-alpine
        container_name: redis-cache
        restart: unless-stopped
        command: redis-server --requirepass ${REDIS_PASSWORD}
        volumes:
            - redisdata:/data
        ports:
            - "6379:6379"
        networks:
            - laravel-network

    # phpMyAdmin Service
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: phpmyadmin
        restart: unless-stopped
        environment:
            PMA_HOST: db
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            PMA_PORT: 3306
        ports:
            - "8080:80"
        depends_on:
            - db
        networks:
            - laravel-network

networks:
    laravel-network:
        driver: bridge

volumes:
    dbdata:
        driver: local
    redisdata:
        driver: local

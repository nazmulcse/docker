server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # Handle static files directly
    location ~ \.(css|js|gif|jpe?g|png|ico|webp|woff2?|ttf|eot|svg)$ {
        try_files $uri =404;
    }

    # Proxy requests to the Octane server
    location / {
        # Check if the file exists on the disk first
        try_files $uri @octane;
    }

    # Fallback to Octane for all other requests
    location @octane {
        # The 'app' service is listening on port 8000
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny access to . files
    location ~ /\. {
        deny all;
    }
}
